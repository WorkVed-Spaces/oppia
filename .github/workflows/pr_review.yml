name: PR Review Handling

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  handle_review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Handle PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract PR details and sanitize inputs
          PR_NUMBER=${{ github.event.pull_request.number }}
          AUTHOR_LOGIN="${{ github.event.pull_request.user.login }}"
          REVIEWER_LOGIN="${{ github.event.review.user.login }}"
          REVIEW_STATE="${{ github.event.review.state }}"

          SANITIZED_AUTHOR=$(echo "$AUTHOR_LOGIN" | sed 's/[^a-zA-Z0-9_-]//g')
          SANITIZED_REVIEWER=$(echo "$REVIEWER_LOGIN" | sed 's/[^a-zA-Z0-9_-]//g')

          # Get requested reviewers via GitHub API
          REQUESTED_REVIEWERS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" | \
            grep -Eo '"login": "[^"]+"' | awk -F'"' '{print $4}' | \
            tr '\n' ' ' | sed 's/ /","/g; s/^/[\"/; s/$/\"]/')

          if [[ "$REVIEW_STATE" == "APPROVED" ]]; then
            # Retrieve current approvals
            APPROVALS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" | \
              grep -B 3 '"state": "APPROVED"' | grep '"login":' | awk -F'"' '{print $4}' | sort -u)

            ALL_APPROVED=true
            PENDING_REVIEWERS=()
            for reviewer in $(echo $REQUESTED_REVIEWERS | tr -d '[]"' | tr ',' ' '); do
              if ! echo "$APPROVALS" | grep -qxF "$reviewer"; then
                ALL_APPROVED=false
                PENDING_REVIEWERS+=( "$reviewer" )
              fi
            done

            if $ALL_APPROVED; then
              # Add LGTM label and assign the author
              curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels" \
                -d '{"labels":["LGTM"]}'
              
              curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/assignees" \
                -d "{\"assignees\":[\"$SANITIZED_AUTHOR\"]}"
            else
              # Re-request pending reviews
              for reviewer in "${PENDING_REVIEWERS[@]}"; do
                curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Content-Type: application/json" \
                  "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers" \
                  -d "{\"reviewers\":[\"$reviewer\"]}"
              done
            fi

          elif [[ "$REVIEW_STATE" == "CHANGES_REQUESTED" ]]; then
            # Remove LGTM label, unassign reviewer, and reassign author
            curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels/LGTM" || true

            curl_response=$(curl -s -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/assignees" \
              -d "{\"assignees\":[\"$SANITIZED_REVIEWER\"]}")

            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/assignees" \
              -d "{\"assignees\":[\"$SANITIZED_AUTHOR\"]}"

            echo "Unassignment response code: ${curl_response: -3}"
            echo "Unassignment response body: ${curl_response%???}"
          fi
